name: Deploy Supabase Database Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
  workflow_dispatch:

jobs:
  deploy-migrations:
    name: Apply Database Migrations to Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase Project & Push Migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || 'abuaziyfhgmzeiqjtcas' }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "❌ SUPABASE_ACCESS_TOKEN secret is missing in GitHub Repository Secrets."
            echo "Please create a personal access token at https://supabase.com/dashboard/account/tokens and add it to your repo secrets."
            exit 1
          fi

          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "❌ SUPABASE_DB_PASSWORD secret is missing in GitHub Repository Secrets."
            echo "Please add your Supabase database password to your repo secrets."
            exit 1
          fi

          echo "🔗 Linking to Supabase project $PROJECT_ID..."
          supabase link --project-ref "$PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

          echo "🚀 Pushing pending migrations..."
          supabase db push --password "$SUPABASE_DB_PASSWORD"

          echo "✅ All database migrations applied successfully!"
